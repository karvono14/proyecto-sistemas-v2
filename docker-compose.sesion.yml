# Sesión local: central SIMULADO + 4 grupos (gSPAa..gSPAd), cada uno con su Redis.
# Todos los grupos ejecutan NUESTRO servidor: simula la sesión de clase, no interopera con terceros.
x-redis: &redis
  image: redis:7-alpine
  command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
  healthcheck:
    test: ["CMD", "redis-cli", "ping"]
    interval: 2s
    timeout: 2s
    retries: 15

x-server: &server
  build: ./server
  environment: &server-env
    CENTRAL_URL: http://central:9000

services:
  central:
    build: ./mock_central
    ports: ["9000:9000"]
    networks: [front]

  redis-a:
    <<: *redis
    volumes: ["redis-a-data:/data"]
    networks: [back-a]
  server-a:
    <<: *server
    environment:
      <<: *server-env
      GROUP_NAME: gSPAa
      PUBLIC_URL: http://server-a:8000
      REDIS_URL: redis://redis-a:6379/0
    depends_on:
      redis-a: {condition: service_healthy}
      central: {condition: service_started}
    ports: ["8000:8000"]
    networks: [front, back-a]

  redis-b:
    <<: *redis
    volumes: ["redis-b-data:/data"]
    networks: [back-b]
  server-b:
    <<: *server
    environment:
      <<: *server-env
      GROUP_NAME: gSPAb
      PUBLIC_URL: http://server-b:8000
      REDIS_URL: redis://redis-b:6379/0
    depends_on:
      redis-b: {condition: service_healthy}
      central: {condition: service_started}
    ports: ["8001:8000"]
    networks: [front, back-b]

  redis-c:
    <<: *redis
    volumes: ["redis-c-data:/data"]
    networks: [back-c]
  server-c:
    <<: *server
    environment:
      <<: *server-env
      GROUP_NAME: gSPAc
      PUBLIC_URL: http://server-c:8000
      REDIS_URL: redis://redis-c:6379/0
    depends_on:
      redis-c: {condition: service_healthy}
      central: {condition: service_started}
    ports: ["8002:8000"]
    networks: [front, back-c]

  redis-d:
    <<: *redis
    volumes: ["redis-d-data:/data"]
    networks: [back-d]
  server-d:
    <<: *server
    environment:
      <<: *server-env
      GROUP_NAME: gSPAd
      PUBLIC_URL: http://server-d:8000
      REDIS_URL: redis://redis-d:6379/0
    depends_on:
      redis-d: {condition: service_healthy}
      central: {condition: service_started}
    ports: ["8003:8000"]
    networks: [front, back-d]

networks:
  front:
  back-a:
  back-b:
  back-c:
  back-d:

volumes:
  redis-a-data:
  redis-b-data:
  redis-c-data:
  redis-d-data:
