# Despliegue de UN grupo contra un servidor central externo. Toda la configuración viene del entorno (.env).
#   cp .env.example .env  (editar)  &&  docker compose up --build -d
services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  server:
    build: ./server
    environment:
      GROUP_NAME: ${GROUP_NAME:?defina GROUP_NAME (ej. gSPAa)}
      PUBLIC_URL: ${PUBLIC_URL:?defina PUBLIC_URL (URL con la que el central alcanza este servidor)}
      CENTRAL_URL: ${CENTRAL_URL:?defina CENTRAL_URL (URL del servidor central)}
      REDIS_URL: redis://redis:6379/0
      HEALTH_INTERVAL: ${HEALTH_INTERVAL:-2}
      HEALTH_FAILURES: ${HEALTH_FAILURES:-3}
      REGISTER_INTERVAL: ${REGISTER_INTERVAL:-30}
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "${HOST_PORT:-8000}:8000"

volumes:
  redis-data:
